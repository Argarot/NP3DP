<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Session 005 arch and timed-chord method profiles</title>
  <desc id="desc">Scaled side profiles of the first two method motifs after the collar. The arch edge envelope gives a 0.10 millimetre first apex and a 0.20 millimetre second apex. The timed chord rises 0.0125 millimetres per 4.1769 millimetre chord and has a deposit and dwell at each departing endpoint.</desc>
  <rect width="1000" height="620" fill="#fbfaf7"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #20252b; }
    .title { font-size: 24px; font-weight: 700; }
    .heading { font-size: 18px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #4c5661; }
    .axis { stroke: #59636e; stroke-width: 1.5; }
    .grid { stroke: #d8d4ca; stroke-width: 1; stroke-dasharray: 4 4; }
    .arch { fill: none; stroke: #176b87; stroke-width: 4; }
    .chord { fill: none; stroke: #a4472d; stroke-width: 4; }
    .nominal { fill: none; stroke: #7e8790; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .deposit { fill: #a4472d; stroke: #fbfaf7; stroke-width: 2; }
  </style>
  <text x="60" y="40" class="title">First two method motifs after the 4.2 mm collar</text>

  <text x="60" y="78" class="heading">08 · staggered quadratic arches</text>
  <text x="950" y="78" text-anchor="end" class="small">vertical scale: 0–0.25 mm above method start</text>
  <line x1="120" y1="275" x2="940" y2="275" class="axis"/>
  <line x1="120" y1="95" x2="120" y2="275" class="axis"/>
  <line x1="120" y1="203" x2="940" y2="203" class="grid"/>
  <line x1="120" y1="131" x2="940" y2="131" class="grid"/>
  <text x="108" y="280" text-anchor="end" class="label">0.00</text>
  <text x="108" y="208" text-anchor="end" class="label">0.10</text>
  <text x="108" y="136" text-anchor="end" class="label">0.20</text>
  <text x="34" y="185" transform="rotate(-90 34 185)" text-anchor="middle" class="label">relative Z (mm)</text>
  <path d="M120 275 L920 257.3673" class="nominal"/>
  <path d="M120 275 Q320 126.5714 520 266.1837" class="arch"/>
  <path d="M520 266.1837 Q720 -26.2653 920 257.3673" class="arch"/>
  <circle cx="320" cy="198.6" r="5" fill="#176b87"/>
  <circle cx="720" cy="117.8" r="5" fill="#176b87"/>
  <text x="320" y="187" text-anchor="middle" class="label">first apex +0.10 mm</text>
  <text x="720" y="106" text-anchor="middle" class="label">full apex +0.20 mm</text>
  <line x1="120" y1="275" x2="120" y2="282" class="axis"/>
  <line x1="520" y1="275" x2="520" y2="282" class="axis"/>
  <line x1="920" y1="275" x2="920" y2="282" class="axis"/>
  <text x="120" y="300" text-anchor="middle" class="label">0</text>
  <text x="520" y="300" text-anchor="middle" class="label">4.103</text>
  <text x="920" y="300" text-anchor="middle" class="label">8.206</text>
  <text x="520" y="324" text-anchor="middle" class="label">nominal contour distance (mm)</text>

  <text x="60" y="375" class="heading">09 · zero-lift timed chords</text>
  <text x="950" y="375" text-anchor="end" class="small">vertical scale: 0–0.03 mm above method start</text>
  <line x1="120" y1="545" x2="940" y2="545" class="axis"/>
  <line x1="120" y1="405" x2="120" y2="545" class="axis"/>
  <line x1="120" y1="498.3" x2="940" y2="498.3" class="grid"/>
  <line x1="120" y1="451.7" x2="940" y2="451.7" class="grid"/>
  <text x="108" y="550" text-anchor="end" class="label">0.00</text>
  <text x="108" y="503" text-anchor="end" class="label">0.01</text>
  <text x="108" y="456" text-anchor="end" class="label">0.02</text>
  <text x="34" y="475" transform="rotate(-90 34 475)" text-anchor="middle" class="label">relative Z (mm)</text>
  <path d="M120 545 L520 486.7 L920 428.3" class="chord"/>
  <circle cx="120" cy="545" r="7" class="deposit"/>
  <circle cx="520" cy="486.7" r="7" class="deposit"/>
  <circle cx="920" cy="428.3" r="5" fill="#a4472d"/>
  <text x="135" y="528" class="label">0.02 mm³ deposit + 0.10 s dwell</text>
  <text x="535" y="470" class="label">next departing endpoint</text>
  <line x1="120" y1="545" x2="120" y2="552" class="axis"/>
  <line x1="520" y1="545" x2="520" y2="552" class="axis"/>
  <line x1="920" y1="545" x2="920" y2="552" class="axis"/>
  <text x="120" y="570" text-anchor="middle" class="label">0</text>
  <text x="520" y="570" text-anchor="middle" class="label">4.177</text>
  <text x="920" y="570" text-anchor="middle" class="label">8.354</text>
  <text x="520" y="596" text-anchor="middle" class="label">moving chord path length (mm)</text>
</svg>
